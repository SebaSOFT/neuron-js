name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  dry-run:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn build
      - name: Dry Run Publish
        run: npm publish --dry-run
