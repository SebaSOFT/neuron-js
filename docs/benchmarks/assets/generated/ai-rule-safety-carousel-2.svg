<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d">
  <title id="t">Validate before runtime</title>
  <desc id="d">A JSON rule passes through a schema validation gate. One invalid path is blocked in rose with an exact JSON path, while a corrected rule exits with an emerald pass marker.</desc>
  <metadata>Asset: NJS-GROWTH-07 ai-rule-safety-carousel slide 2 of 5. Package: @sebasoft/neuron-js. Qualitative safety/governance content; no benchmark or performance claims.</metadata>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0v44" fill="none" stroke="#1e293b" stroke-width="0.7"/></pattern>
    <marker id="emerald" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0l12 4.5L0 9z" fill="#34d399"/></marker>
    <marker id="rose" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0l12 4.5L0 9z" fill="#fb7185"/></marker>
    <style><![CDATA[
      .text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e5e7eb}
      .mono{font-family:"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace}
      .idx{font-size:24px;font-weight:700;fill:#22d3ee}
      .brand{font-size:22px;font-weight:500;fill:#94a3b8}
      .head{font-size:64px;font-weight:780;letter-spacing:-.03em;fill:#e5e7eb}
      .body{font-size:31px;font-weight:500;fill:#cbd5e1}
      .label{font-size:24px;font-weight:600}
      .small{font-size:22px;font-weight:500}
      .foot{font-size:24px;font-weight:600;fill:#94a3b8}
    ]]></style>
  </defs>
  <rect width="1080" height="1350" fill="#020617"/>
  <rect width="1080" height="1350" fill="url(#grid)" opacity=".6"/>
  <rect x="28" y="28" width="1024" height="1294" rx="30" fill="rgba(15,23,42,.55)" stroke="#1e293b" stroke-width="2"/>
  <text x="72" y="108" class="mono idx">02 / 05</text>
  <text x="1008" y="108" text-anchor="end" class="text brand">AI-rule safety</text>
  <text x="72" y="220" class="text head">Validate before runtime.</text>
  <text x="72" y="296" class="text body">Schema-first checks reject malformed scripts</text>
  <text x="72" y="338" class="text body">before they reach execution.</text>

  <!-- draft -->
  <g transform="translate(96 470)">
    <rect width="220" height="150" rx="16" fill="#0f172a"/>
    <rect width="220" height="150" rx="16" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="70" text-anchor="middle" class="mono label" fill="#fbbf24">rule draft</text>
    <text x="110" y="108" text-anchor="middle" class="mono small" fill="#94a3b8">JSON in</text>
  </g>
  <!-- validation gate -->
  <g transform="translate(430 420)">
    <rect width="220" height="250" rx="18" fill="#0f172a"/>
    <rect width="220" height="250" rx="18" fill="rgba(52,211,153,.10)" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="58" text-anchor="middle" class="mono label" fill="#34d399">validateScript()</text>
    <circle cx="110" cy="140" r="44" fill="rgba(52,211,153,.14)" stroke="#34d399" stroke-width="3"/>
    <path d="M86 140l16 18 32-40" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <text x="110" y="216" text-anchor="middle" class="mono small" fill="#94a3b8">schema gate</text>
  </g>
  <path d="M320 545h104" fill="none" stroke="#fbbf24" stroke-width="3.5" marker-end="url(#emerald)"/>

  <!-- pass exit -->
  <g transform="translate(764 420)">
    <rect width="220" height="150" rx="16" fill="#0f172a"/>
    <rect width="220" height="150" rx="16" fill="rgba(52,211,153,.10)" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="70" text-anchor="middle" class="mono label" fill="#34d399">schema: pass</text>
    <text x="110" y="108" text-anchor="middle" class="mono small" fill="#94a3b8">ready to run</text>
  </g>
  <path d="M654 495h104" fill="none" stroke="#34d399" stroke-width="3.5" marker-end="url(#emerald)"/>

  <!-- blocked path -->
  <g transform="translate(430 760)">
    <rect width="554" height="150" rx="16" fill="#0f172a"/>
    <rect width="554" height="150" rx="16" fill="rgba(251,113,133,.10)" stroke="#fb7185" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="32" y="62" class="mono label" fill="#fb7185">blocked: conditions[0].operator</text>
    <text x="32" y="108" class="mono small" fill="#94a3b8">exact JSON path returned for repair</text>
  </g>
  <path d="M540 670c0 40-30 60-70 86" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#rose)"/>
  <!-- repair loop -->
  <path d="M430 835c-150 0-150 -150 -40 -290" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#rose)" opacity=".8"/>
  <text x="150" y="700" class="mono small" fill="#fb7185">repair loop</text>

  <text x="540" y="1296" text-anchor="middle" class="mono foot">@sebasoft/neuron-js — TypeScript-first JSON business rules</text>
</svg>
