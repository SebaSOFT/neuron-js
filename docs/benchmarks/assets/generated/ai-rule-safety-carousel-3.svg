<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d">
  <title id="t">Constrain what can run</title>
  <desc id="d">A validated rule enters a developer-owned registry boundary. Approved action and condition tiles connect in cyan, while an unapproved action is blocked outside the boundary.</desc>
  <metadata>Asset: NJS-GROWTH-07 ai-rule-safety-carousel slide 3 of 5. Package: @sebasoft/neuron-js. Qualitative safety/governance content; no benchmark or performance claims.</metadata>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0v44" fill="none" stroke="#1e293b" stroke-width="0.7"/></pattern>
    <marker id="cyan" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0l12 4.5L0 9z" fill="#22d3ee"/></marker>
    <marker id="rose" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0l12 4.5L0 9z" fill="#fb7185"/></marker>
    <style><![CDATA[
      .text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e5e7eb}
      .mono{font-family:"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace}
      .idx{font-size:24px;font-weight:700;fill:#22d3ee}
      .brand{font-size:22px;font-weight:500;fill:#94a3b8}
      .head{font-size:64px;font-weight:780;letter-spacing:-.03em;fill:#e5e7eb}
      .body{font-size:31px;font-weight:500;fill:#cbd5e1}
      .label{font-size:24px;font-weight:600}
      .tile{font-size:23px;font-weight:600}
      .small{font-size:22px;font-weight:500}
      .foot{font-size:24px;font-weight:600;fill:#94a3b8}
    ]]></style>
  </defs>
  <rect width="1080" height="1350" fill="#020617"/>
  <rect width="1080" height="1350" fill="url(#grid)" opacity=".6"/>
  <rect x="28" y="28" width="1024" height="1294" rx="30" fill="rgba(15,23,42,.55)" stroke="#1e293b" stroke-width="2"/>
  <text x="72" y="108" class="mono idx">03 / 05</text>
  <text x="1008" y="108" text-anchor="end" class="text brand">AI-rule safety</text>
  <text x="72" y="220" class="text head">Constrain what can run.</text>
  <text x="72" y="296" class="text body">A developer-owned registry defines approved</text>
  <text x="72" y="338" class="text body">actions, conditions, parameters, and rules.</text>

  <!-- registry boundary -->
  <g transform="translate(96 430)">
    <rect width="640" height="520" rx="24" fill="rgba(8,51,68,.30)" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="40" y="58" class="mono label" fill="#22d3ee">developer registry</text>
    <text x="600" y="58" text-anchor="end" class="mono small" fill="#94a3b8">approved vocabulary only</text>

    <rect x="48" y="96" width="260" height="120" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="178" y="150" text-anchor="middle" class="mono tile" fill="#e5e7eb">condition</text>
    <text x="178" y="186" text-anchor="middle" class="mono small" fill="#94a3b8">compare_two_numbers</text>

    <rect x="332" y="96" width="260" height="120" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="462" y="150" text-anchor="middle" class="mono tile" fill="#e5e7eb">action</text>
    <text x="462" y="186" text-anchor="middle" class="mono small" fill="#94a3b8">apply_discount</text>

    <rect x="48" y="248" width="260" height="120" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="178" y="302" text-anchor="middle" class="mono tile" fill="#e5e7eb">parameter</text>
    <text x="178" y="338" text-anchor="middle" class="mono small" fill="#94a3b8">state_number</text>

    <rect x="332" y="248" width="260" height="120" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="462" y="302" text-anchor="middle" class="mono tile" fill="#e5e7eb">rule</text>
    <text x="462" y="338" text-anchor="middle" class="mono small" fill="#94a3b8">simple_rule</text>

    <path d="M178 216v32M462 216v32M178 372h284" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity=".7"/>
    <rect x="48" y="408" width="544" height="74" rx="12" fill="rgba(34,211,238,.08)" stroke="#22d3ee"/>
    <text x="320" y="453" text-anchor="middle" class="mono label" fill="#22d3ee">no arbitrary code</text>
  </g>

  <!-- blocked unapproved action -->
  <g transform="translate(770 600)">
    <rect width="214" height="170" rx="16" fill="#0f172a"/>
    <rect width="214" height="170" rx="16" fill="rgba(251,113,133,.10)" stroke="#fb7185" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="107" y="64" text-anchor="middle" class="mono tile" fill="#fb7185">auto_refund</text>
    <text x="107" y="98" text-anchor="middle" class="mono tile" fill="#fb7185">_all_orders</text>
    <text x="107" y="140" text-anchor="middle" class="mono small" fill="#94a3b8">unapproved</text>
  </g>
  <path d="M770 685H742" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#rose)"/>
  <text x="744" y="640" text-anchor="end" class="mono small" fill="#fb7185">blocked</text>

  <text x="540" y="1296" text-anchor="middle" class="mono foot">@sebasoft/neuron-js — TypeScript-first JSON business rules</text>
</svg>
