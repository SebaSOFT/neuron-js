<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From JSON rule to explainable decision</title>
  <desc id="desc">Neuron-JS inspectability diagram showing business input and serializable rule JSON passing through schema validation, developer-owned registry constraints, deterministic Synapse evaluation, result output, match/fail trace, and audit-ready decision. A dashed error branch shows validation errors returning to a repair loop.</desc>
  <metadata>Asset: NJS-GROWTH-07 explainability-trace-diagram. Package: @sebasoft/neuron-js. Sources: docs/schemas-validation-explainability.md, docs/benchmarks/visual-proof-system.md, docs/benchmarks/prompt-kit.md, chaos-vault NJS-GROWTH-07 evidence notes. Integrity: no benchmark or performance claims.</metadata>
