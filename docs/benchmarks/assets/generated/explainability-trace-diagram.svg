    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#1e293b" stroke-width="0.7"/></pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="cyanArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0 0l12 4-12 4z" fill="#22d3ee"/></marker>
    <marker id="violetArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0 0l12 4-12 4z" fill="#a78bfa"/></marker>
    <marker id="roseArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0 0l12 4-12 4z" fill="#fb7185"/></marker>
