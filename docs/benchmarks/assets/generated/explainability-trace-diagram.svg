  <g transform="translate(92 608)"><rect width="260" height="92" rx="14" class="card"/><rect width="260" height="92" rx="14" fill="rgba(136,19,55,.32)" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 6"/><text x="22" y="34" class="text label">Validation errors</text><text x="22" y="64" class="mono nodeSub muted">exact JSON paths guide repair</text></g><g transform="translate(458 608)"><rect width="246" height="92" rx="14" class="card"/><rect width="246" height="92" rx="14" fill="rgba(136,19,55,.20)" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 6"/><text x="22" y="34" class="text label">Repair loop</text><text x="22" y="64" class="mono nodeSub muted">fix input before execution</text></g>
