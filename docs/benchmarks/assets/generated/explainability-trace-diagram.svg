  <title
     id="title">From JSON rule to explainable decision</title>
  <desc
     id="desc">Neuron-JS inspectability diagram showing business input and serializable rule JSON passing through schema validation, developer-owned registry constraints, deterministic Synapse evaluation, result output, match/fail trace, and audit-ready decision. A dashed error branch shows validation errors returning to a repair loop.</desc>
  <metadata
     id="metadata1">Asset: NJS-GROWTH-07 explainability-trace-diagram. Package: @sebasoft/neuron-js. Sources: docs/schemas-validation-explainability.md, docs/benchmarks/visual-proof-system.md, docs/benchmarks/prompt-kit.md, internal NJS-GROWTH-07 research notes. Integrity: no benchmark or performance claims.</metadata>
