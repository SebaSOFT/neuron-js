<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d">
  <title id="t">Review like code</title>
  <desc id="d">A generated rule card sits beside a review checklist showing tests, owner approval, and rollback snapshot. The visual emphasizes governance before production use.</desc>
  <metadata>Asset: NJS-GROWTH-07 ai-rule-safety-carousel slide 4 of 5. Package: @sebasoft/neuron-js. Qualitative safety/governance content; no benchmark or performance claims.</metadata>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0v44" fill="none" stroke="#1e293b" stroke-width="0.7"/></pattern>
    <style><![CDATA[
      .text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e5e7eb}
      .mono{font-family:"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace}
      .idx{font-size:24px;font-weight:700;fill:#22d3ee}
      .brand{font-size:22px;font-weight:500;fill:#94a3b8}
      .head{font-size:64px;font-weight:780;letter-spacing:-.03em;fill:#e5e7eb}
      .body{font-size:31px;font-weight:500;fill:#cbd5e1}
      .item{font-size:28px;font-weight:600;fill:#e5e7eb}
      .label{font-size:24px;font-weight:600}
      .small{font-size:22px;font-weight:500}
      .foot{font-size:24px;font-weight:600;fill:#94a3b8}
    ]]></style>
  </defs>
  <rect width="1080" height="1350" fill="#020617"/>
  <rect width="1080" height="1350" fill="url(#grid)" opacity=".6"/>
  <rect x="28" y="28" width="1024" height="1294" rx="30" fill="rgba(15,23,42,.55)" stroke="#1e293b" stroke-width="2"/>
  <text x="72" y="108" class="mono idx">04 / 05</text>
  <text x="1008" y="108" text-anchor="end" class="text brand">AI-rule safety</text>
  <text x="72" y="220" class="text head">Review like code.</text>
  <text x="72" y="296" class="text body">Generated rules still need tests, approval,</text>
  <text x="72" y="338" class="text body">ownership, and rollback before production use.</text>

  <!-- rule card -->
  <g transform="translate(96 460)">
    <rect width="320" height="430" rx="20" fill="#0f172a"/>
    <rect width="320" height="430" rx="20" fill="rgba(167,139,250,.08)" stroke="#a78bfa" stroke-width="2"/>
    <text x="40" y="64" class="mono label" fill="#a78bfa">generated rule</text>
    <rect x="36" y="96" width="248" height="240" rx="12" fill="#111827" stroke="#1e293b"/>
    <text x="60" y="146" class="mono small" fill="#22d3ee">id</text>
    <text x="60" y="182" class="mono small" fill="#94a3b8">vip-discount</text>
    <text x="60" y="230" class="mono small" fill="#22d3ee">when</text>
    <text x="60" y="266" class="mono small" fill="#94a3b8">subtotal &gt;= 100</text>
    <text x="60" y="314" class="mono small" fill="#94a3b8">apply 16%</text>
    <text x="40" y="392" class="mono small" fill="#94a3b8">sample structure only</text>
  </g>

  <!-- checklist -->
  <g transform="translate(470 460)">
    <rect width="514" height="430" rx="20" fill="#0f172a"/>
    <rect width="514" height="430" rx="20" fill="rgba(52,211,153,.06)" stroke="#34d399" stroke-width="2"/>
    <text x="40" y="64" class="mono label" fill="#34d399">review checklist</text>

    <g transform="translate(40 104)">
      <circle cx="22" cy="22" r="22" fill="rgba(52,211,153,.16)" stroke="#34d399" stroke-width="2"/>
      <path d="M11 22l8 9 16-19" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <text x="64" y="32" class="text item">Test cases</text>
    </g>
    <g transform="translate(40 188)">
      <circle cx="22" cy="22" r="22" fill="rgba(52,211,153,.16)" stroke="#34d399" stroke-width="2"/>
      <path d="M11 22l8 9 16-19" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <text x="64" y="32" class="text item">Owner approval</text>
    </g>
    <g transform="translate(40 272)">
      <circle cx="22" cy="22" r="22" fill="rgba(52,211,153,.16)" stroke="#34d399" stroke-width="2"/>
      <path d="M11 22l8 9 16-19" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <text x="64" y="32" class="text item">Rollback ready</text>
    </g>
    <rect x="40" y="344" width="434" height="56" rx="12" fill="rgba(167,139,250,.10)" stroke="#a78bfa"/>
    <text x="257" y="380" text-anchor="middle" class="mono label" fill="#a78bfa">owner review, not auto-approval</text>
  </g>

  <text x="540" y="1296" text-anchor="middle" class="mono foot">@sebasoft/neuron-js — TypeScript-first JSON business rules</text>
</svg>
